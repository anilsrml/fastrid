<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Display Pro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <nav class="navbar">
        <ul class="navbar-nav">
            <li><span class="nav-title">READRUSSSSH</span></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <div id="wordDisplay">Ready to start!</div>

            <div class="controls">
                <div class="button-group">
                    <button id="prevButton" class="btn btn-secondary">Önceki</button>
                    <button id="startButton" class="btn btn-primary">Start</button>
                </div>

                <div class="speed-control">
                    <div class="speed-labels">
                        <span class="speed-label">Hızlı</span>
                        <span class="speed-label">Yavaş</span>
                    </div>
                    <input type="range" id="speed" min="200" max="800" value="500">
                    <span id="speedValue">500ms</span>
                </div>
            </div>

            <div id="errorMessage" class="error-message"></div>
        </div>
    </div>

    <script>
        // Flask template değişkenini JavaScript'e aktarıyoruz
        const words = {{ words|tojson|safe }};
    </script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
